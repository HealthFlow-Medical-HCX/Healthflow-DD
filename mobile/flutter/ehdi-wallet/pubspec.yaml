name: ehdi_wallet
description: Egyptian Healthcare Digital Identity Wallet - EHDI with Valify eKYC Integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.0

  # Biometrics & Security
  local_auth: ^2.1.8
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Camera & Document Scanning
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  image: ^4.1.4

  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

  # Date & Time
  intl: ^0.18.1

  # Icons
  cupertino_icons: ^1.0.6
  flutter_phosphor_icons: ^0.0.1+6

  # File Handling
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  open_file: ^3.3.2

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1

  # Permissions
  permission_handler: ^11.2.0

  # Device Info
  device_info_plus: ^9.1.1

  # Connectivity
  connectivity_plus: ^5.0.2

  # Google Fonts for Arabic
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
